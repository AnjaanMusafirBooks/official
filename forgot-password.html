<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Password Recovery — Anjaan Musafir Books</title><style>:root{--ink:#172033;--muted:#667085;--line:#e5e7eb;--accent:#6d4aff}*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:var(--ink);font:16px/1.5 system-ui,sans-serif}.wrap{max-width:540px;margin:36px auto;padding:16px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 14px 40px #1018280c}.brand{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:800}h1{line-height:1.2}p{color:var(--muted)}label{display:block;font-weight:650;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #cfd4df;border-radius:10px;font:inherit}button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--accent);color:white;font:inherit;font-weight:750;margin-top:18px}.status{white-space:pre-wrap;margin-top:14px;padding:12px;background:#f1f5f9;border-radius:10px}a{color:var(--accent)}</style></head><body><main class="wrap"><section class="card"><div class="brand">ANJAAN MUSAFIR BOOKS</div><h1>Forgot admin password?</h1><p>Enter your admin email. If an active account matches and email delivery is configured, a one-time reset link will be sent. For security, the message is the same whether or not an account exists.</p><form id="form"><label for="email">Admin email</label><input id="email" name="email" type="email" maxlength="254" required autocomplete="email"><button id="submit" type="submit">Send reset link</button></form><div id="status" class="status" role="status" aria-live="polite" hidden></div><p><a href="team-login.html">Back to login</a></p></section></main><script src="new-version-config.js"></script><script>(()=>{const form=document.getElementById('form'),out=document.getElementById('status'),btn=document.getElementById('submit'),base=String(window.NM_NEW_VERSION_CONFIG?.API_BASE||'').trim().replace(/\/+$/,'');form.addEventListener('submit',async e=>{e.preventDefault();out.hidden=false;out.textContent='Requesting reset…';if(!/^https:\/\//i.test(base)){out.textContent='Reset service is not configured yet. Contact the system owner.';return}btn.disabled=true;try{const r=await fetch(base+'/api/v2/admin/password-reset/request',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({email:document.getElementById('email').value.trim().toLowerCase()})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');out.textContent=d.message||'If an active account matches, a reset email will arrive shortly.'}catch(err){out.textContent=err.message}finally{btn.disabled=false}})})();</script></body></html>
