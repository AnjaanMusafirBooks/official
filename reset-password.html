<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Reset Admin Password — Anjaan Musafir Books</title><style>:root{--ink:#172033;--muted:#667085;--line:#e5e7eb;--accent:#6d4aff}*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:var(--ink);font:16px/1.5 system-ui,sans-serif}.wrap{max-width:540px;margin:36px auto;padding:16px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 14px 40px #1018280c}.brand{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:800}h1{line-height:1.2}p{color:var(--muted)}label{display:block;font-weight:650;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #cfd4df;border-radius:10px;font:inherit}button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--accent);color:white;font:inherit;font-weight:750;margin-top:18px}.status{white-space:pre-wrap;margin-top:14px;padding:12px;background:#f1f5f9;border-radius:10px}a{color:var(--accent)}</style></head><body><main class="wrap"><section class="card"><div class="brand">ANJAAN MUSAFIR BOOKS</div><h1>Choose a new password</h1><p>Reset links expire after 30 minutes and can be used once. Changing your password signs out active admin sessions.</p><form id="form"><label for="password">New password</label><input id="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"><small>At least 12 characters with uppercase, lowercase and a number.</small><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="12" maxlength="128" required autocomplete="new-password"><button id="submit" type="submit">Change password</button></form><div id="status" class="status" role="status" aria-live="polite" hidden></div><p><a href="team-login.html">Back to login</a></p></section></main><script src="new-version-config.js"></script><script>(()=>{const form=document.getElementById('form'),out=document.getElementById('status'),btn=document.getElementById('submit'),base=String(window.NM_NEW_VERSION_CONFIG?.API_BASE||'').trim().replace(/\/+$/,'');const token=new URLSearchParams(location.hash.replace(/^#/, '')).get('token')||'';form.addEventListener('submit',async e=>{e.preventDefault();out.hidden=false;const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(!token){out.textContent='Reset token missing. Request a new reset link.';return}if(password!==confirm){out.textContent='Passwords do not match.';return}if(!/^https:\/\//i.test(base)){out.textContent='Reset service is not configured yet. Contact the system owner.';return}btn.disabled=true;out.textContent='Changing password…';try{const r=await fetch(base+'/api/v2/admin/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({token,password})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Password reset failed');out.textContent=d.message||'Password changed. Please sign in.';form.reset();history.replaceState(null,'',location.pathname)}catch(err){out.textContent=err.message}finally{btn.disabled=false}})})();</script></body></html>
