<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Manual Purchase Request — Anjaan Musafir Books</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#667085;--line:#e5e7eb;--accent:#6d4aff}*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:680px;margin:32px auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(20px,5vw,36px);box-shadow:0 16px 48px #1822300d}.brand{font-size:13px;letter-spacing:.12em;font-weight:800;color:var(--accent)}h1{font-size:clamp(26px,5vw,36px);line-height:1.15;margin:12px 0}p{color:var(--muted)}label{display:block;font-weight:650;margin:14px 0 6px}input{width:100%;padding:13px 14px;border:1px solid #cfd4df;border-radius:10px;font:inherit}button{width:100%;border:0;border-radius:12px;background:var(--accent);color:white;font:inherit;font-weight:750;padding:14px;margin-top:20px}button:disabled{opacity:.6}small{color:var(--muted)}.status{white-space:pre-wrap;margin-top:16px;padding:14px;border-radius:10px;background:#f1f5f9}.status.error{background:#fff1f2;color:#9f1239}.status.ok{background:#ecfdf3;color:#166534}.back{display:inline-block;margin-top:18px;color:var(--accent)}
</style></head>
<body><main class="wrap"><section class="card"><div class="brand">ANJAAN MUSAFIR BOOKS</div><h1>Manual Purchase Request</h1><p>इस विकल्प का उपयोग तभी करें जब online payment उपलब्ध न हो। Request भेजने से payment verify नहीं होती और eBook तुरंत unlock नहीं होती। Admin payment record जाँचने के बाद ही order approve करेगा।</p>
<form id="request-form"><label for="product_id">Product ID *</label><input id="product_id" name="product_id" required maxlength="100" autocomplete="off"><small>यह ID book page या support से लें।</small>
<label for="customer_name">Full name *</label><input id="customer_name" name="customer_name" required minlength="2" maxlength="100" autocomplete="name">
<label for="customer_email">Purchase email *</label><input id="customer_email" name="customer_email" required type="email" maxlength="254" autocomplete="email">
<label for="customer_phone">Mobile number *</label><input id="customer_phone" name="customer_phone" required type="tel" minlength="8" maxlength="20" autocomplete="tel">
<label for="payment_reference">Payment reference / UTR (optional)</label><input id="payment_reference" name="payment_reference" maxlength="100" autocomplete="off">
<label for="amount_paid">Amount paid in ₹ (optional)</label><input id="amount_paid" name="amount_paid" type="number" min="0.01" step="0.01">
<button id="submit-button" type="submit">Submit purchase request</button></form><div id="result" class="status" role="status" aria-live="polite" hidden></div><a class="back" href="index.html">← Back to books</a></section></main>
<script src="new-version-config.js"></script><script>
(()=>{'use strict';const form=document.getElementById('request-form'),out=document.getElementById('result'),btn=document.getElementById('submit-button'),params=new URLSearchParams(location.search);document.getElementById('product_id').value=params.get('product_id')||'';const cfg=window.NM_NEW_VERSION_CONFIG||{},base=String(cfg.API_BASE||'').trim().replace(/\/+$/,'');form.addEventListener('submit',async e=>{e.preventDefault();out.hidden=false;out.className='status';if(!/^https:\/\//i.test(base)){out.textContent='Purchase request service अभी configure नहीं है। कृपया बाद में प्रयास करें या support से संपर्क करें।';out.classList.add('error');return}const data=Object.fromEntries(new FormData(form).entries());data.product_id=data.product_id.trim();data.customer_name=data.customer_name.trim();data.customer_email=data.customer_email.trim().toLowerCase();data.customer_phone=data.customer_phone.trim();if(!data.payment_reference){delete data.payment_reference;delete data.amount_paid}else data.amount_paid=Number(data.amount_paid);btn.disabled=true;btn.textContent='Submitting…';try{const r=await fetch(base+'/api/v2/purchase-requests',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(data)});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request submit नहीं हो सकी।');out.classList.add('ok');out.textContent='Request ID: '+d.request_id+'\nStatus: '+d.status+'\nExpected amount: ₹'+Number(d.expected_amount).toFixed(2)+'\n\n'+d.message+'\nRequest ID संभालकर रखें। Admin approval के बाद ही order access मिलेगा.';form.reset();document.getElementById('product_id').value=params.get('product_id')||''}catch(err){out.classList.add('error');out.textContent=err.message}finally{btn.disabled=false;btn.textContent='Submit purchase request'}})})();
</script></body></html>
